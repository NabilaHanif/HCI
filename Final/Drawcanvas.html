<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Drawing App</title>

<style>
    body{
        margin:0;
        font-family:Arial, sans-serif;
        background:#f0f4f8;
        display:flex;
        flex-direction:column;
        align-items:center;
    }

    h1{
        margin-top:20px;
        color:#333;
    }

    .toolbar{
        margin:15px;
        display:flex;
        gap:15px;
        align-items:center;
        background:white;
        padding:12px 20px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    button{
        padding:10px 18px;
        border:none;
        border-radius:6px;
        background:#007bff;
        color:white;
        cursor:pointer;
        font-size:15px;
    }

    button:hover{
        background:#0056b3;
    }

    canvas{
        border:3px solid #444;
        background:white;
        border-radius:10px;
        cursor:crosshair;
    }
</style>
</head>

<body>

<h1>Interactive Drawing Application</h1>

<div class="toolbar">
    <label><b>Brush Color:</b></label>
    <input type="color" id="colorPicker">

    <button onclick="clearCanvas()">Clear Screen</button>
</div>

<canvas id="drawingCanvas" width="900" height="500"></canvas>

<script>
    const canvas = document.getElementById("drawingCanvas");
    const ctx = canvas.getContext("2d");

    let drawing = false;

    // Default brush settings
    ctx.lineWidth = 5;
    ctx.lineCap = "round";

    // Start Drawing
    canvas.addEventListener("mousedown", (e) => {
        drawing = true;
        draw(e);
    });

    // Stop Drawing
    canvas.addEventListener("mouseup", () => {
        drawing = false;
        ctx.beginPath();
    });

    // Mouse leaves canvas
    canvas.addEventListener("mouseleave", () => {
        drawing = false;
        ctx.beginPath();
    });

    // Draw on mouse move
    canvas.addEventListener("mousemove", draw);

    function draw(e){
        if(!drawing) return;

        // Brush Color
        ctx.strokeStyle = document.getElementById("colorPicker").value;

        ctx.lineTo(e.offsetX, e.offsetY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(e.offsetX, e.offsetY);
    }

    // Clear Canvas
    function clearCanvas(){
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
</script>

</body>
</html>
