<!DOCTYPE html>
<html>
<head>
<title>Modern Beautiful House Scene</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(to bottom,#87ceeb,#dff6ff);
    font-family:Arial, sans-serif;
}

/* Canvas */
.canvas{
    width:750px;
    height:500px;
    border:4px solid #444;
    position:relative;
    overflow:hidden;
    background:linear-gradient(to bottom,#6ec6ff,#c9f0ff);
    border-radius:12px;
}

/* Sun */
.sun{
    width:100px;
    height:100px;
    background:#ffd700;
    border-radius:50%;
    position:absolute;
    top:30px;
    left:40px;
    box-shadow:0 0 50px #ffd700;
}

/* Clouds */
.cloud1, .cloud2{
    position:absolute;
    background:white;
    border-radius:50px;
}

.cloud1{
    width:120px;
    height:50px;
    top:60px;
    left:220px;
}

.cloud1::before,
.cloud1::after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud1::before{
    width:60px;
    height:60px;
    top:-20px;
    left:15px;
}

.cloud1::after{
    width:70px;
    height:70px;
    top:-30px;
    right:15px;
}

.cloud2{
    width:100px;
    height:45px;
    top:110px;
    right:90px;
}

.cloud2::before,
.cloud2::after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud2::before{
    width:50px;
    height:50px;
    top:-15px;
    left:10px;
}

.cloud2::after{
    width:60px;
    height:60px;
    top:-25px;
    right:10px;
}

/* Ground */
.ground{
    width:100%;
    height:150px;
    background:#3cb043;
    position:absolute;
    bottom:0;
}

/* House Body */
.house{
    width:190px;
    height:130px;
    background:#f4a261;
    position:absolute;
    bottom:150px;
    left:280px;
    border:3px solid #5c4033;
    border-radius:5px;
}

/* Roof */
.roof{
    width:0;
    height:0;
    border-left:110px solid transparent;
    border-right:110px solid transparent;
    border-bottom:100px solid #8b0000;
    position:absolute;
    bottom:280px;
    left:265px;
}

/* Door */
.door{
    width:45px;
    height:80px;
    background:#5b3a29;
    position:absolute;
    bottom:150px;
    left:350px;
    border-radius:5px;
}

.door::after{
    content:"";
    width:8px;
    height:8px;
    background:gold;
    border-radius:50%;
    position:absolute;
    right:6px;
    top:40px;
}

/* Windows */
.window1, .window2{
    width:40px;
    height:40px;
    background:#e0f7ff;
    border:3px solid white;
    position:absolute;
    bottom:220px;
    border-radius:4px;
}

.window1{
    left:305px;
}

.window2{
    left:405px;
}

/* Tree */
.tree-trunk{
    width:25px;
    height:80px;
    background:#6b3e26;
    position:absolute;
    bottom:150px;
    left:120px;
}

.tree-leaves{
    width:90px;
    height:90px;
    background:#228b22;
    border-radius:50%;
    position:absolute;
    bottom:210px;
    left:87px;
}

/* Flowers */
.flower1, .flower2, .flower3{
    width:15px;
    height:15px;
    background:pink;
    border-radius:50%;
    position:absolute;
    bottom:120px;
}

.flower1{ left:520px; }
.flower2{ left:560px; background:yellow; }
.flower3{ left:600px; background:red; }

</style>
</head>

<body>

<div class="canvas">

    <!-- Sun -->
    <div class="sun"></div>

    <!-- Clouds -->
    <div class="cloud1"></div>
    <div class="cloud2"></div>

    <!-- Ground -->
    <div class="ground"></div>

    <!-- Roof -->
    <div class="roof"></div>

    <!-- House -->
    <div class="house"></div>

    <!-- Door -->
    <div class="door"></div>

    <!-- Windows -->
    <div class="window1"></div>
    <div class="window2"></div>

    <!-- Tree -->
    <div class="tree-trunk"></div>
    <div class="tree-leaves"></div>

    <!-- Flowers -->
    <div class="flower1"></div>
    <div class="flower2"></div>
    <div class="flower3"></div>

</div>

</body>
</html>
